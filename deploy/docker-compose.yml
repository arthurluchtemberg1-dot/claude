# Implantação de referência (homologação/produção pequena).
# Caminho rápido: sudo bash deploy/install.sh --domain painel.seudominio.com.br --email voce@seudominio.com.br
#   (gera deploy/.env com segredos, sobe tudo com HTTPS automático pelo perfil "https" — Caddy — e cria o proprietário).
# Manual: cp deploy/.env.example deploy/.env (preencha) e
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile https up -d --build
# Sem o perfil "https", use seu próprio proxy reverso e exponha painel (3000) e API (4000) somente via HTTPS.
# Ver docs/DEPLOYMENT.md (checklist, backup/restauração, rotação de chaves).
name: tracker

x-app-env: &app-env
  NODE_ENV: production
  APP_ENV: ${APP_ENV:-production}
  PUBLIC_API_URL: ${PUBLIC_API_URL:?defina PUBLIC_API_URL}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?defina NEXT_PUBLIC_APP_URL}
  CORS_ORIGINS: ${NEXT_PUBLIC_APP_URL}
  DATABASE_URL_APP: postgres://tracker_app:${DB_APP_PASSWORD:?}@postgres:5432/tracker
  DATABASE_URL_SYSTEM: postgres://tracker_system:${DB_SYSTEM_PASSWORD:?}@postgres:5432/tracker
  REDIS_URL: redis://redis:6379
  CREDENTIALS_KEYS: ${CREDENTIALS_KEYS:?defina CREDENTIALS_KEYS}
  CREDENTIALS_KEY_CURRENT: ${CREDENTIALS_KEY_CURRENT:-1}
  TOKEN_HMAC_SECRET: ${TOKEN_HMAC_SECRET:?defina TOKEN_HMAC_SECRET}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  MFA_REQUIRED_DEFAULT: ${MFA_REQUIRED_DEFAULT:-true}
  EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
  EMAIL_FROM: ${EMAIL_FROM:-Tracker <no-reply@example.com>}
  SMTP_URL: ${SMTP_URL:-}
  ALLOW_EXTERNAL_DELIVERY: ${ALLOW_EXTERNAL_DELIVERY:-false}
  WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
  WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
  WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
  RULES_KILL_SWITCH: ${RULES_KILL_SWITCH:-false}
  AI_PROVIDER: ${AI_PROVIDER:-none}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  OUTBOUND_BLOCKED_HOSTS: ${OUTBOUND_BLOCKED_HOSTS:-}
  API_RATE_LIMIT_PER_KEY: ${API_RATE_LIMIT_PER_KEY:-120}
  API_RATE_LIMIT_PER_ORG: ${API_RATE_LIMIT_PER_ORG:-600}
  WEBHOOK_RATE_LIMIT_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_PER_MINUTE:-600}
  COLLECT_RATE_LIMIT_PER_MINUTE: ${COLLECT_RATE_LIMIT_PER_MINUTE:-300}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SIGNUP_MODE: ${SIGNUP_MODE:-open}
  META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
  META_APP_SECRET: ${META_APP_SECRET:-}

services:
  postgres:
    image: postgres:16.13
    # Autovacuum mais frequente: estatísticas acompanham picos de vendas (D-028). Em banco gerenciado, ajuste o parâmetro equivalente.
    command: ["postgres", "-c", "autovacuum_naptime=10s"]
    environment:
      POSTGRES_DB: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4
    # AOF: jobs em trânsito sobrevivem a reinícios (a outbox no PostgreSQL continua sendo a fonte de verdade).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Migrações (somente para frente) e papéis mínimos com LOGIN; executa e termina antes da API/worker.
  migrate:
    image: tracker-api:${TRACKER_VERSION:-local}
    build: { context: .., target: api }
    command: ["sh", "-c", "node dist/db-cli.js migrate && node dist/db-cli.js provision-roles"]
    environment:
      DATABASE_URL_ADMIN: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/tracker
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: tracker-api:${TRACKER_VERSION:-local}
    build: { context: .., target: api }
    init: true
    environment:
      <<: *app-env
      API_PORT: "4000"
    ports:
      - "${API_BIND:-127.0.0.1}:4000:4000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    image: tracker-worker:${TRACKER_VERSION:-local}
    build: { context: .., target: worker }
    init: true
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

  web:
    image: tracker-web:${TRACKER_VERSION:-local}
    build:
      context: ..
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    init: true
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # HTTPS automático (Let's Encrypt) no domínio do painel; a API fica em /api no mesmo domínio (deploy/Caddyfile).
  caddy:
    image: caddy:2.10.0
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TRACKER_DOMAIN: ${TRACKER_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
